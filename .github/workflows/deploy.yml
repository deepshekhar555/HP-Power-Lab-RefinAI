name: RefinAI Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Docker Build Test
      run: docker build -t refinai-test .

    - name: Verify Container Health Check
      run: |
        docker run -d --name refinai_ci -p 3000:3000 refinai-test
        sleep 5
        curl -f http://localhost:3000/health || exit 1
